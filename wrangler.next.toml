name = "springforth-next"
account_id = "ddf0cf5b4491ba59765378877fe8c697"   # Pressword
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Direct binding to the live DB — it lives on this account (sf-d1proxy
# was the cross-account bridge from Widespread; not needed here).
[[d1_databases]]
binding = "DB"
database_name = "springforth-coord"
database_id = "faf15373-f1c6-421f-aaf0-c62abc8c8839"
migrations_dir = "migrations"

[[services]]
binding = "SELF"
service = "springforth-next"
environment = "production"

[[services]]
binding = "WEB"
service = "springforth-next-web"
environment = "production"

[vars]
ENVIRONMENT = "production"
WEB_FRONTEND = "1"
CHAIN_MODE = "celo"
SILVI_CAMPAIGN_ID = "5"
GIVETH_API = "https://mainnet.serve.giveth.io/graphql"
SOULUTIONS_URL = "https://soulutions.earth"
RESTOR_URL = "https://restor.eco"
GAP_API = "https://gapapi.karmahq.xyz"
OC_API = "https://api.opencollective.com/graphql/v2"
REGEN_LCD = "https://lcd-regen.keplr.app"
BLOOM_URL = "https://hdkzuqwqcauhtqkrrzjx.supabase.co"
RESTOR_MAX_SITES = "200"
OC_SEARCH_TERMS = "public goods,regenerative,climate,forest,commons"

# No D1_PROXY_URL — direct same-account binding above.
# No [triggers] — the prod worker (springforth on Widespread) keeps
# running the hourly oracle/sweep against the shared DB; a second cron
# would double-run it.
# No PAGES R2 binding — the bucket lives on Widespread; anonGetCache
# degrades to in-isolate memoization.

[ai]
binding = "AI"

# secrets intentionally unset on this demo deploy:
#   ADMIN_TOKEN (write/admin endpoints 401), TELEGRAM_* (webhook no-ops),
#   SILVI_API_KEY (sync lane inactive), D1_PROXY_KEY (not needed).
