name = "springforth"
account_id = "46966abcfb8f1245ec055842177edcb2"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "springforth-coord"
database_id = "bddc2d20-4ebf-4bae-a7d2-12315badfb6d"
migrations_dir = "migrations"

# Self service-binding — kept for future server-side splicing needs
# (plain fetch() to our own URL fails with CF error 1042).
[[services]]
binding = "SELF"
service = "springforth"
environment = "production"

# springforth-web — the React frontend Worker. Browser page requests
# forward there when WEB_FRONTEND=1; it pulls page data back via x-sf-ui.
[[services]]
binding = "WEB"
service = "springforth-web"
environment = "production"

[vars]
ENVIRONMENT = "production"
# Frontend handoff switch — '1' routes browser HTML GETs to springforth-web.
WEB_FRONTEND = "1"
# Chain lane: read-side + unsigned-calldata only — the worker never signs.
# All protocol contracts verified live on celo mainnet (2026-10-20).
# celo-sepolia is the proving ground once contracts are deployed there.
CHAIN_MODE = "celo"
# Silvi public API — campaign-scoped key (secret: SILVI_API_KEY) unlocks
# campaign 5 "Kenya/Uganda" verified planting claims via /silvi/sync.
SILVI_CAMPAIGN_ID = "5"
# External project-place lanes — all keyless public surfaces.
# Defaults live in the adapters; these are the env overrides.
GIVETH_API = "https://mainnet.serve.giveth.io/graphql"
SOULUTIONS_URL = "https://soulutions.earth"
RESTOR_URL = "https://restor.eco"
GAP_API = "https://gapapi.karmahq.xyz"
OC_API = "https://api.opencollective.com/graphql/v2"
REGEN_LCD = "https://lcd-regen.keplr.app"
BLOOM_URL = "https://hdkzuqwqcauhtqkrrzjx.supabase.co"
# Restor bulk hydration stays outside the worker (scripts/restor-import.mjs);
# in-worker hydrate is for incremental top-ups only.
RESTOR_MAX_SITES = "200"
# Comma-separated public-goods search terms for OC discovery.
OC_SEARCH_TERMS = "public goods,regenerative,climate,forest,commons"
# Cross-account D1: when set, env.DB calls route over HTTPS to sf-d1proxy
# (Pressword account — its D1 row quota is separate from Widespread's).
# Remove this line to fall back to the local binding. Secret: D1_PROXY_KEY.
D1_PROXY_URL = "https://sf-d1proxy.delta-git.workers.dev"

# Workers AI — embeddings for meaning-matched search + overlap scoring.
# bge-base-en-v1.5 (768-dim); free tier, no secret needed.
[ai]
binding = "AI"

# Real-time MRV: hourly oracle cycle over live open-data sources.
[triggers]
crons = ["0 * * * *"]

# R2 media bucket — requires one manual step: enable R2 in the Cloudflare
# dashboard (r2 → get started) then uncomment + deploy. Route 503s until then.
#[[r2_buckets]]
#binding = "MEDIA"
#bucket_name = "springforth-media"

# R2 page cache — anonymous GET responses memoized globally (see
# anonGetCache / PAGES in src/index.ts).
[[r2_buckets]]
binding = "PAGES"
bucket_name = "springforth-cache"

# secrets (set via `wrangler secret put`):
#   ADMIN_TOKEN — bearer token for write endpoints
